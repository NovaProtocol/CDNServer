<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CDNServer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/material/light/theme.css">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen" style="background: var(--ui-surface); color: var(--ui-on-surface); font-family: var(--ui-font-body);">
  <header class="border-b px-6 py-4 flex items-center justify-between" style="border-color: var(--ui-outline);">
    <a href="/" class="flex items-center gap-2 font-semibold" style="font-family: var(--ui-font-mono);">
      <span style="color: var(--ui-primary);">cdn</span><span>.projectnova.download</span>
    </a>
    <nav class="flex items-center gap-3 text-sm">
      <a href="/" class="ui-btn ui-btn--ghost">Kits</a>
      <a href="/manage" class="ui-btn ui-btn--outline">Manage</a>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-5xl px-6 py-8 text-xs" style="color: var(--ui-on-surface-variant);">
    CDNServer — shared design-language kits + rehosted assets.
  </footer>
</body>
</html>
