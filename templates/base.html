<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CDNServer{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.projectnova.download" crossorigin>
  <link rel="stylesheet" href="https://cdn.projectnova.download/flat/dark/theme.css?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { background: var(--ui-surface); color: var(--ui-on-surface); font-family: var(--ui-font-body); margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 6px; }
    h2 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 10px; }
    .sub { color: var(--ui-on-surface-variant); }
    a { color: var(--ui-primary); }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
<nav class="ui-navbar">
  <div class="ui-navbar__inner">
    <span class="ui-navbar__lead" aria-hidden="true"></span>
    <a class="ui-navbar__brand" href="/">~/<span>cdn</span></a>
    <div class="ui-navbar__right">
      <ul class="ui-navbar__links">
        <li><a class="ui-navbar__link" href="/">Home</a></li>
        <li><a class="ui-navbar__link" href="/manage">Manage</a></li>
      </ul>
      <button class="ui-theme-toggle" aria-label="Toggle light/dark"></button>
    </div>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="ui-footer">
  <div class="ui-footer__inner">
    <div>CDNServer — shared design-language kits + rehosted assets</div>
    <div><a href="/manage">Manage</a></div>
  </div>
</footer>
<script src="https://cdn.projectnova.download/shell.js"></script>
</body>
</html>
